# Render Blueprint: web service + PostgreSQL. Render -> New -> Blueprint -> select this repository,
# then fill the values marked "sync: false" on the Environment page.
services:
  - type: web
    name: dyllu-catalog
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    # prestart: sync schema + create admin from ADMIN_EMAIL / ADMIN_PASSWORD (scripts/prestart.mjs)
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: dyllu-db
          property: connectionString
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: dyllu-db
    plan: free
    region: frankfurt
