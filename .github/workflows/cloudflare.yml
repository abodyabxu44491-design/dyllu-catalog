# Manual Cloudflare tasks, run from GitHub → Actions → "Cloudflare" → Run workflow.
#   deploy   build the site and publish it to Cloudflare Workers (applies new D1 migrations first)
#   migrate  copy the PostgreSQL (Neon) data into D1 and the uploaded files into R2, then verify every table and file
#   files    copy any missing uploaded files into R2 (skips identical ones), then verify every table and file
#   domain   point dyllusa.com and www at the Worker (after the zone is active), then test the site there
#   check    read-only test of the deployed site (pages, images, health, search)
#   verify   re-check D1/R2 against the last export manifest without changing anything
# Secrets (GitHub → Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# ADMIN_SESSION_SECRET (optional: when absent, one is generated inside Cloudflare on the first deploy and then kept),
# NEON_DATABASE_URL (migrate only),
# ANTHROPIC_API_KEY (optional, translations), CF_ANALYTICS_TOKEN (optional, usage alerts).
name: Cloudflare
on:
  workflow_dispatch:
    inputs:
      task:
        description: "deploy | migrate | files | verify | check | domain | cpu | profile | logs"
        required: true
        default: deploy
        type: choice
        options: [deploy, migrate, files, verify, check, domain, cpu, profile, logs]
permissions:
  contents: read
concurrency:
  group: cloudflare
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply D1 schema migrations
        if: inputs.task == 'deploy' || inputs.task == 'migrate'
        run: npx wrangler d1 migrations apply dyllu --remote

      - name: Copy data (Neon → D1, files → R2)
        if: inputs.task == 'migrate'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          # Refuse to import twice: the target must still be empty
          COUNT=$(npx wrangler d1 execute dyllu --remote --json --command 'SELECT COUNT(*) AS n FROM "Product"' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].results[0].n))')
          if [ "$COUNT" != "0" ]; then echo "D1 already has $COUNT products. Not importing again."; exit 1; fi
          node scripts/migrate-to-d1.mjs export "$NEON_DATABASE_URL" migration
          npx wrangler d1 execute dyllu --remote --file migration/data.sql
          node scripts/migrate-to-d1.mjs files migration --remote
          node scripts/migrate-to-d1.mjs verify migration --remote

      - name: Copy missing files (Neon → R2) and verify
        if: inputs.task == 'files'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          node scripts/migrate-to-d1.mjs export "$NEON_DATABASE_URL" migration
          node scripts/migrate-to-d1.mjs files migration --remote
          node scripts/migrate-to-d1.mjs verify migration --remote

      - name: Verify D1 and R2 against the last export
        if: inputs.task == 'verify'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          node scripts/migrate-to-d1.mjs export "$NEON_DATABASE_URL" migration
          node scripts/migrate-to-d1.mjs verify migration --remote

      # Only counts and fingerprints are kept (no customer data)
      - name: Keep the verification manifest
        if: inputs.task != 'deploy' && always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-manifest
          path: migration/manifest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build and deploy to Workers
        if: inputs.task == 'deploy'
        timeout-minutes: 20
        env:
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare build
          # Prerendered pages go to the R2 cache through the API (the built-in step starts a remote helper worker that can hang)
          node scripts/cf-cache.mjs
          OPEN_NEXT_DEPLOY=true npx wrangler deploy
          # Secrets are stored encrypted in Cloudflare, never in the repository
          put() { if [ -n "${2:-}" ]; then printf '%s' "$2" | npx wrangler secret put "$1"; fi; }
          if [ -n "${ADMIN_SESSION_SECRET:-}" ]; then
            put ADMIN_SESSION_SECRET "$ADMIN_SESSION_SECRET"
          elif ! npx wrangler secret list --format json | grep -q '"ADMIN_SESSION_SECRET"'; then
            # First deploy without a provided value: generate one inside Cloudflare (never printed, never stored elsewhere)
            put ADMIN_SESSION_SECRET "$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          fi
          # Notification keys (VAPID): created once inside Cloudflare, then kept. Changing them would disconnect every subscribed phone.
          if ! npx wrangler secret list --format json | grep -q '"VAPID_PRIVATE_KEY"'; then
            KEYS=$(node -e 'crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign"]).then(async k=>{const j=await crypto.subtle.exportKey("jwk",k.privateKey);const p=Buffer.from(await crypto.subtle.exportKey("raw",k.publicKey)).toString("base64url");console.log(p+" "+j.d)})')
            put VAPID_PUBLIC_KEY "${KEYS%% *}"
            put VAPID_PRIVATE_KEY "${KEYS##* }"
          fi
          put ANTHROPIC_API_KEY "${ANTHROPIC_API_KEY:-}"
          put CF_ANALYTICS_TOKEN "${CF_ANALYTICS_TOKEN:-}"

      - name: Check the deployed site (read-only)
        if: inputs.task == 'check'
        timeout-minutes: 8
        run: |
          # Where the domain points right now, as seen by the .com registry and public resolvers
          echo "Registry nameservers:"; dig +time=3 +tries=1 +short NS dyllusa.com @a.gtld-servers.net || true
          for r in 1.1.1.1 8.8.8.8 9.9.9.9 208.67.222.222; do echo "dyllusa.com via $r: $(dig +time=3 +tries=1 +short dyllusa.com @$r | tr '\n' ' ')"; done
          echo "Old Vercel DNS still answers: $(dig +time=3 +tries=1 +short dyllusa.com @ns1.vercel-dns.com | tr '\n' ' ')"
          node scripts/cf-smoke.mjs https://dyllu-catalog.dyllucatalog.workers.dev
          echo "--- dyllusa.com ---"; node scripts/cf-smoke.mjs https://dyllusa.com || true

      - name: Point the domain at the Worker and test it
        if: inputs.task == 'domain'
        run: |
          set -euo pipefail
          node scripts/cf-domain.mjs dyllusa.com www.dyllusa.com
          # The certificate can take a few minutes; wait until the site answers over HTTPS
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null --max-time 15 https://dyllusa.com/api/health; then break; fi
            echo "waiting for https://dyllusa.com ($i)"; sleep 20
          done
          node scripts/cf-smoke.mjs https://dyllusa.com
          curl -sS -o /dev/null -w "www: %{http_code}\n" https://www.dyllusa.com/

      - name: CPU time per request (last hours)
        if: inputs.task == 'cpu' || inputs.task == 'check' || inputs.task == 'logs'
        run: node scripts/cf-cpu.mjs 6 || true

      - name: Real requests from Workers Logs (failures and CPU per path)
        if: inputs.task == 'logs'
        timeout-minutes: 5
        env:
          DEBUG_LOGS: "1"
        run: node scripts/cf-logs.mjs 24

      - name: CPU per request from live logs (wrangler tail)
        if: inputs.task == 'profile'
        timeout-minutes: 10
        run: |
          npx wrangler tail dyllu-catalog --format json > tail.jsonl 2> tail.err &
          TAIL=$!
          sleep 15
          node scripts/cf-smoke.mjs https://dyllusa.com || true
          node scripts/cf-smoke.mjs https://dyllusa.com || true
          sleep 20
          kill $TAIL || true
          sleep 2
          tail -5 tail.err || true
          node scripts/cf-profile.mjs tail.jsonl
